name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  demo:
    name: Demo (Vite/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api:
    name: Production API (Fastify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  infra:
    name: Infrastructure (Bicep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build
        run: az bicep build --file production/infra/main.bicep
